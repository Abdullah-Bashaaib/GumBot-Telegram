name: Daily Telegram Bot Post

on:
  schedule:
    # يعمل يومياً الساعة 8:00 صباحاً بتوقيت UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل السكربت يدوياً من GitHub للتجربة

jobs:
  post-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
        run: python substrate-bot.py

