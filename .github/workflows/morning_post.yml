name: حديث الصباح
on:
  schedule:
    - cron: '0 2 * * *'   # 7:00 صباحًا بتوقيت مكة
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: تشغيل حديث الصباح
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}   # ← هذا السطر موجود؟

        run: python post_topic.py hadith
