name: نشر حديث الصباح

on:
  schedule:
    - cron: '0 4 * * *'   # 7:00 AM Mecca time (UTC+3)
  workflow_dispatch:      # للتشغيل اليدوي عند الحاجة

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: تثبيت Python والمتطلبات
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: تشغيل البوت - حديث
        env:
          BOT_TOKEN: ${{ 5074251178:AAFoUw3Dr59F6XcWzDGeW0T-j5hAI5deRTY }}
          CHANNEL_ID: ${{ @space1828 }}
        run: python post_topic.py hadith
