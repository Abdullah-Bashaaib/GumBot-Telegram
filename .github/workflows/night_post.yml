name: نشر موضوع عقيدة ليلاً

on:
  schedule:
    - cron: '0 18 * * *'  # 9:00 PM Mecca time
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: تشغيل البوت - عقيدة
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python post_topic.py aqeeda
