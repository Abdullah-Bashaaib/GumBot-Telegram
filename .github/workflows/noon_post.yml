name: حديث الظهيرة
on:
  schedule:
    - cron: '0 9 * * *'   # 12:00 ظهرًا بتوقيت مكة
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: تشغيل حديث الظهيرة
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_IDS }}
        run: python post_topic.py hadith
